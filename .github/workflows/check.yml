name: Verificar portfólio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.12.0'
      - name: Conferir sintaxe
        run: npm run check
      - name: Testar na raiz
        run: npm test
      - name: Testar no caminho do GitHub Pages
        run: npm test
        env:
          SITE_URL: https://caiotlad.github.io
          BASE_PATH: /portfolio-caio
